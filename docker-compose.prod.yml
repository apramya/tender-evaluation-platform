services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tender-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - tender-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tender-postgres
    restart: always
    environment:
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tender_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user -d tender_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tender-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tender-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tender-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://tender_user:${POSTGRES_PASSWORD}@postgres:5432/tender_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_UPLOAD_ON_REQUEST: ${S3_UPLOAD_ON_REQUEST:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PREFIX: ${S3_PREFIX:-tender-evaluation}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/chroma_db}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      PROCESS_UPLOADS_ON_REQUEST: ${PROCESS_UPLOADS_ON_REQUEST:-false}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
      PUBLIC_SIGNUP_ALLOWED_EMAILS: ${PUBLIC_SIGNUP_ALLOWED_EMAILS:-}
      PUBLIC_SIGNUP_ALLOWED_DOMAINS: ${PUBLIC_SIGNUP_ALLOWED_DOMAINS:-}
      PUBLIC_SIGNUP_BLOCKED_EMAILS: ${PUBLIC_SIGNUP_BLOCKED_EMAILS:-}
      PUBLIC_SIGNUP_BLOCKED_DOMAINS: ${PUBLIC_SIGNUP_BLOCKED_DOMAINS:-tempmail.com,10minutemail.com,mailinator.com}
      EMAIL_OTP_EXPIRE_MINUTES: ${EMAIL_OTP_EXPIRE_MINUTES:-10}
      EMAIL_OTP_LENGTH: ${EMAIL_OTP_LENGTH:-6}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      ALLOWED_ORIGINS: "https://${DOMAIN_NAME},https://www.${DOMAIN_NAME}"
      MIN_CONFIDENCE_FOR_AUTO_DECISION: "0.85"
      CONFIDENCE_THRESHOLD_MANUAL_REVIEW: "0.70"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    networks:
      - tender-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://tender_user:${POSTGRES_PASSWORD}@postgres:5432/tender_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_UPLOAD_ON_REQUEST: ${S3_UPLOAD_ON_REQUEST:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PREFIX: ${S3_PREFIX:-tender-evaluation}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/chroma_db}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      VECTOR_SEARCH_ENABLED: ${VECTOR_SEARCH_ENABLED:-true}
      PROCESS_UPLOADS_ON_REQUEST: ${PROCESS_UPLOADS_ON_REQUEST:-false}
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./chroma_db:/app/chroma_db
    networks:
      - tender-network
    healthcheck:
      disable: true
    command: celery -A app.worker.celery_app worker --loglevel=info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  tender-network:
    driver: bridge
